name: Cập nhật số liệu TikTok

on:
  schedule:
    - cron: "7 * * * *"   # every hour (UTC); GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:       # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lấy số liệu mới và dựng lại trang
        run: python update_stats.py

      - name: Lưu thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add haiduongholic.html docs
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi."
          else
            git commit -m "Cập nhật số liệu TikTok"
            git push
          fi
